name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/_core_src/target
          key: ${{ runner.os }}-cargo-core
          restore-keys: ${{ runner.os }}-cargo-core

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configure
        run: cmake -S . -B build

      - name: Build binary and install package
        run: cmake --build build

      - name: Run tests
        run: cmake --build build --target test
