[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cenyslovensko-client-python"
version = "0.1.0"
description = "Python bindings for cenyslovensko RPC server"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cenyslovensko_client*"]

[tool.setuptools.package-data]
cenyslovensko_client = []
